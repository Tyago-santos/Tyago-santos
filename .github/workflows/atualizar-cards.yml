name: Atualizar cards de estatísticas

on:
  schedule:
    - cron: "0 6 * * 1" # toda segunda-feira às 06:00 (UTC)
  workflow_dispatch: # gatilho manual
  push:
    branches: [main]
    paths:
      - "scripts/gerar-cards.py"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar cards em português
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gerar-cards.py

      - name: Commit e push (somente se mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/cards
          if git diff --cached --quiet; then
            echo "Cards sem alterações."
          else
            git commit -m "Atualiza cards de estatísticas"
            git push
          fi
